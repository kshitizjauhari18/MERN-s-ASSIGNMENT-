<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tech Club | Register</title>
</head>

<body>

    <!-- ==================== HEADER & NAVIGATION ==================== -->
    <header>
        <h1>Tech Club Portal</h1>
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About</a></li>
                <li><a href="register.html">Register</a></li>
                <li><a href="contact.html">Contact</a></li>
            </ul>
        </nav>
    </header>

    <!-- ==================== MAIN CONTENT ==================== -->
    <main>
        <section>
            <h2>Student Registration Form</h2>

            <!-- Task 4.1: Form with Name, Email, and Password using Labels -->
            <form action="#" method="POST">

                <div>
                    <label for="fullname">Full Name:</label>
                    <input type="text" id="fullname" name="fullname" required placeholder="Enter your full name">
                </div>
                <br>

                <div>
                    <label for="email">Email Address:</label>
                    <input type="email" id="email" name="email" required placeholder="student@example.com">
                </div>
                <br>

                <div>
                    <label for="password">Password:</label>
                    <input type="password" id="password" name="password" required placeholder="Create a password">
                </div>
                <br>

            </form>
        </section>
    </main>

    <!-- ==================== FOOTER ==================== -->
    <footer>
        <p>&copy; 2026 Tech Club. All rights reserved.</p>
    </footer>

</body>

</html>
