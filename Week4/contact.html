<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Contact the Tech Club team for queries and support.">
  <meta name="author" content="Student Developer">
  <title>Tech Club | Contact Us</title>
  <link rel="icon" type="image/x-icon" href="contact.png">
</head>
<body>

  <!-- NAVIGATION MENU -->
  <header>
    <h1>Tech Club Portal</h1>
    <nav>
      <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="about.html">About</a></li>
        <li><a href="register.html">Register</a></li>
      </ul>
    </nav>
  </header>

  <!-- MAIN CONTENT -->
  <main>
    <section>
      <h2>Get In Touch</h2>
      <p>Have questions about the Tech Club? Send us a message below or email us at <strong>techclub@university.edu</strong>.</p>
    </section>

    <section>
      <h2>Contact Form</h2>
      <form action="thankyou.html" method="GET">
        <p>
          <label for="contact-name">Your Name:</label><br>
          <input type="text" id="contact-name" name="contact-name" required>
        </p>

        <p>
          <label for="contact-email">Your Email:</label><br>
          <input type="email" id="contact-email" name="contact-email" required>
        </p>

        <p>
          <label for="contact-message">Message:</label><br>
          <textarea id="contact-message" name="contact-message" rows="4" cols="40" required></textarea>
        </p>

        <button type="submit">Send Message</button>
      </form>
    </section>
  </main>

  <!-- FOOTER -->
  <footer>
    <p>&copy; 2026 Tech Club. All rights reserved.</p>
  </footer>

</body>
</html>
